version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    reviewers: ["jussray"]
    labels: ["deps", "security", "ci"]
    commit-message:
      prefix: "deps(ci)"
      include: scope
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
